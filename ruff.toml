# bdq.py must run on the Python found next to Vivado installs: keep 3.8 syntax.
target-version = "py38"
line-length = 120

[lint]
# Pyflakes (undefined names, unused imports) and pycodestyle errors only.
select = ["E4", "E7", "E9", "F"]
# E702: the argparse setup puts one subcommand per line on purpose. E741: `l` for a line is idiomatic here.
ignore = ["E702", "E741"]
